    fbq('init', '1561333291845790');

    // Immediate Purchase Pixel & CAPI Fire for Verified SabPaisa SUCCESS Redirects
    (function() {
        try {
            const params = new URLSearchParams(window.location.search);
            const status = (params.get('status') || params.get('sabPaisaStatus') || params.get('statusCode') || params.get('spRespCode') || '').toUpperCase();
            const respMsg = (params.get('respMsg') || params.get('responseMessage') || '').toUpperCase();
            const orderId = params.get('orderId') || params.get('merchant_txn_id') || params.get('clientTxnId') || 'IKKO-ORDER';
            const amountVal = parseFloat(params.get('amount') || '999') || 999;
            const searchLower = window.location.search.toLowerCase();

            const isSuccess = status.includes('SUCCESS') || status === '0000' || respMsg.includes('SUCCESS') || searchLower.includes('status=success') || searchLower.includes('status=completed');
            if (isSuccess && orderId) {
                const eventId = 'order_' + orderId;
                if (typeof fbq === 'function') {
                    fbq('track', 'Purchase', {
                        value: amountVal,
                        currency: 'INR',
                        content_type: 'product'
                    }, { eventID: eventId });
                }
                console.log('[Meta Pixel Head Direct] Purchase event tracked for order:', orderId, 'Value:', amountVal);

                // Direct Server-Side CAPI Trigger Backup
                try {
                    fetch('/api/track-purchase', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({

                            amount: amountVal,
                            customerName: 'Valued Customer',
                            customerPhone: '',
                            customerEmail: 'customer@ikkodigital.store',
                            items: [],
                            userAgent: navigator.userAgent
                        })
                    }).catch(e => {});
                } catch(e){}
            }
        } catch(e) {
            console.error('[Meta Pixel Head Error]', e);
        }
    })();

    <!-- Core Scripts -->
    <script src="app-core.js?v=200.0"></script>
    <script>
        async function renderConfirmation() {
            const card = document.getElementById('confirmation-content-card');
            if (!card) return;

            const urlParams = new URLSearchParams(window.location.search);
            let orderId = urlParams.get('orderId') || urlParams.get('client_txn_id') || urlParams.get('merchant_txn_id');

            if (!orderId) {
                // Fallback to the latest order placed on this browser if no ID is passed in the URL redirect
                const orders = getOrders();
                if (orders.length > 0) {
                    orderId = orders[orders.length - 1].id;
                }
            }

            if (!orderId) {
                card.innerHTML = `
                    <div style="text-align: center; padding: 40px 0;">
                        <h2 style="color: var(--accent); font-family: var(--font-heading);">No Order Information Found</h2>
                        <p style="color: var(--text-muted); margin: 15px 0 30px 0;">We could not locate this order. If you just placed an order, please check your home page.</p>
                        <a href="index.html" class="confirm-home-btn">Return to Storefront</a>
                    </div>
                `;
                return;
            }

            const orders = getOrders();
            let orderIndex = orders.findIndex(o => o.id === orderId);
            let order = orderIndex !== -1 ? orders[orderIndex] : null;

            // Reconstruct minimal order object instantly if not cached locally
            if (!order) {
                const amountParam = parseFloat(urlParams.get('amount') || '999');
                const txnId = urlParams.get('transaction_id') || urlParams.get('spTxnId') || urlParams.get('client_txn_id') || 'SabPaisa Verified';

                order = {
                    id: orderId,
                    date: new Date().toISOString(),
                    status: 'completed',
                    paymentMethod: 'sabpaisa',
                    utr: txnId,
                    customer: {
                        name: 'Valued Customer',
                        phone: '',
                        address: 'SabPaisa PG Redirect',
                        city: '',
                        state: '',
                        pin: ''
                    },
                    items: [],
                    total: amountParam
                };
            }

            // Asynchronously sync order details from Firestore in background (non-blocking)
            (async function syncOrderDataInBackground() {
                try {
                    const db = await Promise.race([
                        initFirebase(),
                        new Promise((_, reject) => setTimeout(() => reject('timeout'), 1200))
                    ]);
                    if (db) {
                        const doc = await db.collection('orders').doc(orderId).get();
                        if (doc.exists && doc.data()) {
                            const remoteOrder = doc.data();
                            if (remoteOrder.items && remoteOrder.items.length > 0) {
                                order.items = remoteOrder.items;
                                order.customer = remoteOrder.customer || order.customer;
                                const currentPgStatus = (urlParams.get('status') || '').toUpperCase();
                                if (currentPgStatus.includes('SUCCESS') || currentPgStatus === '0000') {
                                    renderSuccessUI(order);
                                }
                            }
                        }
                    }
                } catch(e){}
            })();

            // Render different layouts depending on verified status
            function renderSuccessUI(order) {
                // Fire Meta Pixel purchase tracking (handles de-duplication inside app-core)
                if (typeof window.trackPurchaseEvent === 'function') {
                    window.trackPurchaseEvent(order);
                }
                
                // Run diagnostic update
                setTimeout(updatePixelDiagnostics, 500);

                const itemsHtml = order.items.map(item => `
                    <div class="confirmation-item">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="confirmation-item-info">
                            <span class="confirmation-item-title">${item.title}</span>
                            <span class="confirmation-item-qty">Quantity: ${item.qty}</span>
                        </div>
                        <span class="confirmation-item-price">${item.price}</span>
                    </div>
                `).join('');

                const formattedSubtotal = formatPrice(order.total);
                let paymentText = order.paymentMethod === 'cod' ? 'Cash on Delivery (COD)' : 'SabPaisa PG Payment';
                let statusText = order.paymentMethod === 'cod' ? 'Awaiting Delivery' : 'Paid & Confirmed';

                card.innerHTML = `
                    <div class="confirmation-success-header">
                        <div class="success-icon-wrap">
                            <svg viewBox="0 0 24 24" width="40" height="40" stroke="currentColor" stroke-width="3.5" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                        <h1>Order Confirmed!</h1>
                        <p>Thank you for shopping with us, <strong>${order.customer.name}</strong>! Your order is being processed.</p>
                        <div class="order-badge-id">Order ID: ${order.id}</div>
                    </div>

                    <div class="confirmation-details-grid">
                        <div class="details-col">
                            <h3>Shipping Address</h3>
                            <p>
                                <strong>${order.customer.name}</strong><br>
                                ${order.customer.address}<br>
                                ${order.customer.city}, ${order.customer.state} - ${order.customer.pin}<br>
                                📞 Phone: ${order.customer.phone}
                            </p>
                        </div>
                        <div class="details-col">
                            <h3>Billing & Payment</h3>
                            <p>
                                <strong>Method:</strong> ${paymentText}<br>
                                <strong>Status:</strong> ${statusText}<br>
                                <strong>Expected Delivery:</strong> Your order will be delivered next 7 days
                            </p>
                        </div>
                    </div>

                    <h2 class="confirmation-items-title">Ordered Items Summary</h2>
                    <div class="confirmation-items-list">
                        ${itemsHtml}
                    </div>

                    <div class="confirmation-totals">
                        <div class="totals-row">
                            <span>Subtotal</span>
                            <span>${formattedSubtotal}</span>
                        </div>
                        <div class="totals-row">
                            <span>Shipping</span>
                            <span style="color: var(--accent-green); font-weight: bold;">FREE</span>
                        </div>
                        <div class="totals-row final">
                            <span>Total Amount Paid</span>
                            <span>${formattedSubtotal}</span>
                        </div>
                    </div>

                    <div class="continue-btn-wrap" style="margin-bottom: 25px;">
                        <a href="index.html" class="confirm-home-btn">Continue Shopping</a>
                    </div>
                    
                    <!-- Meta Pixel Diagnostic Box (Hidden by default for customers, visible only if URL contains &debug=true or &test=true) -->
                    <div class="pixel-diagnostic-box" id="pixel-diag-box" style="display: none; margin-top: 30px; padding: 15px; border-radius: 8px; background-color: #f7fafc; border: 1px solid #e2e8f0; font-size: 0.85rem; font-family: monospace; color: #4a5568; text-align: left; max-width: 500px; margin-left: auto; margin-right: auto; box-shadow: var(--shadow-sm);">
                        <strong style="color: #2d3748; display: block; margin-bottom: 8px; font-size: 0.9rem;">🔍 Meta Pixel Diagnostic Console</strong>
                        <div style="margin-bottom: 4px;">Target Pixel ID: <span style="color: #2b6cb0; font-weight: 700;">1561333291845790</span></div>
                        <div style="margin-bottom: 4px;">Library Load: <span id="diag-lib-status" style="font-weight: 700; color: #d69e2e;">Checking...</span></div>
                        <div style="margin-bottom: 4px;">Purchase Event: <span id="diag-event-status" style="font-weight: 700; color: #d69e2e;">Verifying...</span></div>
                        <div id="diag-details-row" style="margin-top: 8px; font-size: 0.75rem; color: #718096; line-height: 1.4; border-top: 1px dashed #e2e8f0; padding-top: 8px;">
                            Initializing verification checks...
                        </div>
                    </div>
                `;
            }

            function updatePixelDiagnostics() {
                const libStatusEl = document.getElementById('diag-lib-status');
                const eventStatusEl = document.getElementById('diag-event-status');
                const detailsEl = document.getElementById('diag-details-row');
                const diagBox = document.getElementById('pixel-diag-box');
                
                if (!libStatusEl || !eventStatusEl || !detailsEl || !diagBox) return;
                
                const urlParams = new URLSearchParams(window.location.search);
                const isDebug = urlParams.get('debug') === 'true' || urlParams.get('test') === 'true';
                if (isDebug) {
                    diagBox.style.display = 'block';
                }
                
                const status = window.pixelStatus || {};
                const fbScriptLoaded = (typeof fbq === 'function' && fbq.version);
                
                if (fbScriptLoaded) {
                    libStatusEl.innerText = 'Active (Loaded Successfully)';
                    libStatusEl.style.color = '#38a169'; // Green
                } else if (typeof fbq === 'function') {
                    libStatusEl.innerText = 'Stub Active (Real Script Blocked/Failed)';
                    libStatusEl.style.color = '#dd6b20'; // Orange
                } else {
                    libStatusEl.innerText = 'Blocked / Failed to Load';
                    libStatusEl.style.color = '#e53e3e'; // Red
                }
                
                if (status.fired === 'SUCCESS') {
                    eventStatusEl.innerText = 'SUCCESS (Tracked Rs. ' + (status.value || '0') + ')';
                    eventStatusEl.style.color = '#38a169'; // Green
                    detailsEl.innerHTML = '✅ Purchase event successfully sent to Meta servers for order: <strong>' + (status.orderId || '') + '</strong>.';
                } else if (status.fired && status.fired.startsWith('SKIPPED')) {
                    eventStatusEl.innerText = 'SKIPPED (Duplicate Prevention)';
                    eventStatusEl.style.color = '#3182ce'; // Blue
                    detailsEl.innerHTML = 'ℹ️ This order was already tracked in your current browser session. We block duplicate tracking to protect your Ads Manager metrics. (If you want to fire it again, please place a new order).';
                } else if (status.fired && status.fired.startsWith('FAILED')) {
                    eventStatusEl.innerText = 'FAILED';
                    eventStatusEl.style.color = '#e53e3e'; // Red
                    detailsEl.innerHTML = '❌ Tracking call failed: ' + status.fired;
                } else {
                    eventStatusEl.innerText = 'NOT TRIGGERED';
                    eventStatusEl.style.color = '#e53e3e'; // Red
                    if (!fbScriptLoaded) {
                        detailsEl.innerHTML = '⚠️ The purchase event could not be sent because your browser (or adblocker) blocked the connection to <strong>connect.facebook.net</strong>.';
                    } else {
                        detailsEl.innerHTML = '⚠️ Purchase tracking failed to trigger. Please check your browser developer tools console (F12) for errors.';
                    }
                }
            }

            function renderFailedUI(order) {
                card.innerHTML = `
                    <div style="text-align: center; padding: 40px 0;">
                        <div style="width: 60px; height: 60px; border-radius: 50%; background-color: #fed7d7; color: #e53e3e; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="3" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </div>
                        <h2 style="color: #e53e3e; font-family: var(--font-heading); font-size: 1.6rem; font-weight: 800;">Payment Failed!</h2>
                        <p style="color: var(--text-muted); margin: 15px auto 25px auto; max-width: 380px;">Your transaction could not be authorized by SabPaisa. Please try checkout again.</p>
                        <div class="order-badge-id" style="margin-bottom: 25px; background-color: #f7fafc; color: var(--text-dark);">Order ID: ${order.id}</div>
                        <a href="checkout.html" class="confirm-home-btn" style="background-color: var(--accent); color: white; border: none;">Retry Checkout & Payment</a>
                    </div>
                `;
            }

            function renderPendingUI(order) {
                card.innerHTML = `
                    <div style="text-align: center; padding: 40px 0;">
                        <div style="width: 60px; height: 60px; border-radius: 50%; background-color: #feebc8; color: #dd6b20; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="3" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        </div>
                        <h2 style="color: #dd6b20; font-family: var(--font-heading); font-size: 1.6rem; font-weight: 800;">Payment Awaiting Verification</h2>
                        <p style="color: var(--text-muted); margin: 15px auto 25px auto; max-width: 480px;">Your payment status is still pending confirmation from CCAvenue. We will process your order as soon as we receive confirmation.</p>
                        <div class="order-badge-id" style="margin-bottom: 25px; background-color: #f7fafc; color: var(--text-dark);">Order ID: ${order.id}</div>
                        
                        <div style="margin-top: 10px; display: flex; justify-content: center; gap: 15px;">
                            <button onclick="location.reload()" class="confirm-home-btn" style="background-color: var(--accent); color: white; border: none; cursor: pointer;">Refresh Status</button>
                            <a href="index.html" class="confirm-home-btn" style="background-color: #718096; color: white; border: none;">Return to Storefront</a>
                        </div>
                    </div>
                `;
            }

            async function checkPaymentStatus(orderId, attempt = 1, maxAttempts = 5) {
                try {
                    const amountParam = urlParams.get('amount') || (order ? order.total : '');
                    const checkRes = await fetch(`/api/check-status?orderId=${orderId}&amount=${amountParam}`);
                    if (checkRes.ok) {
                        const statusData = await checkRes.json();
                        if (statusData) {
                            const state = (statusData.state || statusData.status || statusData.code || '').toUpperCase();
                            console.log(`[SabPaisa Status] Parsed state: ${state} for order ${orderId}`);
                            
                            if (state === 'COMPLETED' || state === 'SUCCESS' || state === 'PAYMENT_SUCCESS') {
                                order.status = 'pending';
                                
                                // Extract UTR/Transaction ID securely
                                let utrVal = statusData.spTxnId || statusData.traceId || 'SabPaisa Verified';
                                order.utr = utrVal;
                                
                                if (typeof clearCart === 'function') {
                                    clearCart();
                                }
                                
                                if (typeof window.saveOrder === 'function') {
                                    await window.saveOrder(order);
                                } else {
                                    orders[orderIndex] = order;
                                    localStorage.setItem('ikko_orders', JSON.stringify(orders));
                                }
                                renderSuccessUI(order);
                                return;
                            } else if (state === 'FAILED' || state === 'PAYMENT_ERROR' || state === 'PAYMENT_DECLINED' || state === 'CANCELED' || state === 'CANCELLED' || state === 'EXPIRED') {
                                order.status = 'cancelled';
                                order.utr = 'Payment Failed';
                                
                                if (typeof window.saveOrder === 'function') {
                                    await window.saveOrder(order);
                                } else {
                                    orders[orderIndex] = order;
                                    localStorage.setItem('ikko_orders', JSON.stringify(orders));
                                }
                                renderFailedUI(order);
                                return;
                            }
                        }
                    }
                } catch (e) {
                    console.error("Error checking SabPaisa status:", e);
                }

                if (attempt < maxAttempts) {
                    setTimeout(() => {
                        checkPaymentStatus(orderId, attempt + 1, maxAttempts);
                    }, 3000);
                } else {
                    order.status = 'cancelled';
                    order.utr = 'Payment Failed';
                    if (typeof window.saveOrder === 'function') {
                        await window.saveOrder(order);
                    } else {
                        orders[orderIndex] = order;
                        localStorage.setItem('ikko_orders', JSON.stringify(orders));
                    }
                    renderFailedUI(order);
                }
            }

            // Check URL parameters for explicit payment success/failure indicators from SabPaisa
            const pgStatus = (urlParams.get('status') || urlParams.get('sabPaisaStatus') || urlParams.get('payment_status') || urlParams.get('statusCode') || urlParams.get('spRespCode') || urlParams.get('query_status') || '').toUpperCase();
            const respMsg = (urlParams.get('respMsg') || urlParams.get('responseMessage') || urlParams.get('statusMessage') || urlParams.get('spResponseMessage') || urlParams.get('sabpaisaMessage') || '').toUpperCase();
            const pgTxnStatus = (urlParams.get('txnStatus') || '').toUpperCase();

            const hasSuccessIndicator = 
                pgStatus.includes('SUCCESS') || pgStatus.includes('COMPLETED') || pgStatus === '0000' ||
                respMsg.includes('SUCCESS') || respMsg.includes('COMPLETED') ||
                pgTxnStatus.includes('SUCCESS') || pgTxnStatus.includes('COMPLETED');

            const hasFailedIndicator = 
                pgStatus.includes('FAIL') || pgStatus.includes('DECLINE') || pgStatus.includes('CANCEL') || pgStatus.includes('TIMEOUT') || pgStatus.includes('EXPIRED') || pgStatus.includes('ABANDON') || pgStatus === '0300' || pgStatus === '0100' ||
                respMsg.includes('FAIL') || respMsg.includes('DECLINE') || respMsg.includes('CANCEL') || respMsg.includes('TIMEOUT') || respMsg.includes('EXPIRED') ||
                pgTxnStatus.includes('FAIL') || pgTxnStatus.includes('CANCEL') || pgTxnStatus.includes('TIMEOUT') || pgTxnStatus.includes('EXPIRED');

            if (hasSuccessIndicator) {
                if (orderIndex === -1) {
                    const amountParam = parseFloat(urlParams.get('amount') || '999');
                    const txnId = urlParams.get('transaction_id') || urlParams.get('spTxnId') || urlParams.get('client_txn_id') || 'SabPaisa Verified';

                    order = {
                        id: orderId,
                        date: new Date().toISOString(),
                        status: 'completed',
                        paymentMethod: 'sabpaisa',
                        utr: txnId,
                        customer: {
                            name: 'Valued Customer',
                            phone: '',
                            address: 'SabPaisa PG Redirect',
                            city: '',
                            state: '',
                            pin: ''
                        },
                        items: [],
                        total: amountParam
                    };
                } else {
                    order = orders[orderIndex];
                    order.status = 'completed';
                    const txnId = urlParams.get('transaction_id') || urlParams.get('spTxnId') || urlParams.get('client_txn_id');
                    if (txnId) order.utr = txnId;
                }

                if (typeof clearCart === 'function') {
                    clearCart();
                }

                if (typeof window.saveOrder === 'function') {
                    await window.saveOrder(order);
                } else {
                    const localOrders = getOrders();
                    if (orderIndex === -1) {
                        localOrders.push(order);
                    } else {
                        localOrders[orderIndex] = order;
                    }
                    localStorage.setItem('ikko_orders', JSON.stringify(localOrders));
                }

                renderSuccessUI(order);
                return;
            }

            if (hasFailedIndicator) {
                if (order) {
                    order.status = 'cancelled';
                    order.utr = pgStatus.includes('TIMEOUT') || respMsg.includes('TIMEOUT') ? 'Payment Timed Out' : 'Payment Failed';
                    if (typeof window.saveOrder === 'function') {
                        window.saveOrder(order);
                    } else {
                        orders[orderIndex] = order;
                        localStorage.setItem('ikko_orders', JSON.stringify(orders));
                    }
                }
                renderFailedUI(order);
                return;
            }

            // Status is unknown / pending: Do NOT fire purchase pixel immediately. Verify with backend API!
            card.innerHTML = `
                <div style="text-align: center; padding: 50px 0;" id="verifying-payment-spinner">
                    <div class="loader-spinner" style="border: 4px solid #e2e8f0; border-top: 4px solid var(--accent); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px auto;"></div>
                    <h2 style="font-family: var(--font-heading); color: var(--primary);">Verifying Payment Status...</h2>
                    <p style="color: var(--text-muted); margin-top: 10px; max-width: 400px; margin-left: auto; margin-right: auto;">
                        We are confirming your payment status with SabPaisa. Please wait a moment.
                    </p>
                </div>
            `;
            checkPaymentStatus(orderId, 1, 3);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderConfirmation();
        });
    </script>
</body>
</html>
